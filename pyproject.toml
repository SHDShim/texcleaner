[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texcleaner"
dynamic = ["version"]
description = "A GUI front-end for cleaning LaTeX track changes"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    {name = "Dan Shim"}
]
requires-python = ">=3.10"
dependencies = [
    "arxiv-latex-cleaner",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pytest",
    "httpx"
]

[project.scripts]
texcleaner = "texcleaner.__main__:main"

[tool.setuptools]
packages = ["texcleaner"]
py-modules = ["version"]
package-data = {texcleaner = ["scripts/**/*.py", "scripts/**/*.tex", "scripts/**/*.txt", "scripts/**/*.sh"]}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}
